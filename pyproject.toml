[project]
name = "pydiscodb"  # another project is using DiscoDB name
version = "0.9.5"
description = "An efficient, immutable, persistent mapping object."
requires-python = ">=3.9"
dependencies = []
authors = [
    {name='Nokia Research Center'}
]
maintainers = [
    {name="Dan Bauman"}
]

[tool.setuptools.packages.find]
where = ["python", "src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.cibuildwheel.linux]
# This command runs for the manylinux containers (based on CentOS).
before-all = "yum install -y some-dependency"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
# This command runs for the musllinux containers (based on Alpine Linux).
before-all = "apk add some-dependency"
